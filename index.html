<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shiny-fiesta/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <script type="module" crossorigin src="/shiny-fiesta/assets/main-C8owUOUA.js"></script>
    <link rel="modulepreload" crossorigin href="/shiny-fiesta/assets/balance-Bm8k2YvY.js">
    <link rel="stylesheet" crossorigin href="/shiny-fiesta/assets/balance-Dim4RnF9.css">
  </head>
  <body class="bg-black font-mts-compact">
    <div
      class="flex rounded-[32px] overflow-hidden flex-col justify-between bg-[image:var(--game-bg)] max-w-[360px] w-full max-h-[800px] h-full absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"
    >
      <div
        class="mix-blend-overlay opacity-50 overflow-hidden flex justify-center items-center fixed z-[1] w-full h-full"
      >
        <img
          id="small-rays"
          class="absolute min-h-[200vh] min-w-[200vh] w-auto object-cover translate-y-[-2%]"
          src="RaysSmall.svg"
          alt=""
        />
        <img
          id="big-rays"
          class="absolute min-h-[200vh] min-w-[200vh] w-auto object-cover translate-y-[-2%] opacity-0"
          src="RaysBig.svg"
          alt=""
        />
        <img class="absolute top-0 left-0 w-full h-full" src="Mask.png" alt="" />
      </div>
      <img class="absolute top-0 left-0 w-full h-[44px] z-[10]" src="StatusBar.png" alt="" />
      <img class="absolute bottom-0 left-0 w-full h-[34px] z-[10]" src="ios.png" alt="" />
      <nav data-js="nav" class="z-[2] flex justify-between px-[20px] py-[12px] pt-[56px]" style="transition: opacity 0.3s ease-in-out">
        <div class="flex flex-col gap-[8px]">
          <div class="flex items-center justify-center cursor-pointer w-[32px] h-[32px] rounded-[12px] bg-blur">
            <img class="max-h-[36px] invert" src="IconLeft.svg" alt="" />
          </div>
        </div>
        <div class="flex flex-col items-end gap-[8px]">
          <div
            data-js="balance-cashback"
            class="flex gap-[4px] items-center w-fit h-fit py-[4px] px-[10px] pl-[8px] bg-[image:var(--premium-gradient)] text-white rounded-[16px]"
          >
            <img src="badges/Premium.svg" alt="" />
            <span data-js="balance-cashback-value">3250</span>
          </div>
        </div>
      </nav>
      <div
        data-js="game-container"
        class="absolute top-[30%] left-1/2 transform -translate-x-1/2 w-full z-[2] flex flex-col items-center gap-[8px]"
      >
        <img
          data-js="pointer"
          class="absolute disappear top-[-10%] left-1/2 transform -translate-x-1/2"
          style="transition: opacity 0.3s ease-in-out"
          src="Pointer.svg"
          alt=""
        />
        <div data-js="carousel" class="relative w-full h-[230px] overflow-hidden"></div>
        <div
          data-js="prize-info"
          class="absolute flex flex-col items-center gap-[10px] text-center text-white top-[90%] w-[306px] disappear"
          style="transition: opacity 0.3s ease-in-out"
        >
          <p data-js="prize-title" class="font-mts-text text-[20px] font-medium leading-[24px]"></p>
          <p data-js="prize-subtitle" class="font-mts-compact text-[14px] font-regular leading-[18px]"></p>
          <div data-js="prize-tag" class="hidden c1-medium-comp flex items-center gap-[4px] px-[8px] py-[4px] blur40 bg-[var(--wins-bg)] rounded-[10px] border-[var(--stroke)] border-[1px]">
          <span data-js="prize-tag-text"></span>
          </div>
        </div>
        <a
          href="prizes.html"
          data-js="badge-prizes"
          class="flex gap-[] blur40 cursor-pointer w-fit h-fit py-[6px] px-[12px] bg-[var(--wins-bg)] c2-bold-wide border-[var(--stroke)] border-[1px] text-white rounded-[16px] no-underline"
        >
          Призы
        </a>
      </div>
      <div
        data-js="gama-controls"
        class="absolute bottom-0 left-1/2 transform -translate-x-1/2 z-[100] flex w-full flex-col gap-[12px] px-[20px] items-center pb-[32px]"
      >
        <div
          data-js="gama-controls-button"
          class="flex cursor-pointer h-[52px] shadow-(--accent-shadow) items-center justify-center w-full font-bold p-[14px] bg-white rounded-[16px] uppercase text-black text-size-[12px]"
        >
          <div class="flex gap-[4px] px-[8px] c1-bold-wide">
            <span data-js="spin-btn-label">Крутить бесплатно</span>
          </div>
          <img data-js="spin-btn-icon" class="invert hidden" src="badges/Premium.svg" alt="" />
        </div>
        <p class="text-white c1-regular-comp text-center">
          Нажимая кнопку «Крутить», вы соглашаетесь c
          <a href="" class="text-[var(--linktodocs)]">условиями</a>
        </p>
      </div>
      <!-- win drop -->
      <div
        data-js="win-controls"
        class="absolute bottom-0 left-1/2 transform -translate-x-1/2 z-[100] disappear flex w-full flex-col gap-[12px] px-[20px] items-center pb-[32px]"
      >
        <div
          data-js="play-again-button"
          class="flex cursor-pointer shadow-(--accent-shadow) items-center justify-center w-full h-[52px] font-bold p-[14px] bg-white rounded-[16px] uppercase text-black text-size-[12px]"
        >
          <div class="flex gap-[4px] px-[8px] c1-bold-wide">
            <span>Хорошо</span>
          </div>
        </div>
        <a
          href="#"
          data-js="second-action-button"
          class="hidden flex cursor-pointer items-center justify-center w-full h-[52px] font-bold p-[14px] blur40 bg-[var(--wins-bg)] rounded-[16px] uppercase text-white text-size-[12px]"
        >
          <div class="flex gap-[4px] px-[8px] c1-bold-wide">
            <span data-js="second-action-label"></span>
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
